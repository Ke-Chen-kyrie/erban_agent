[project]
name = "proactive-agent"
version = "0.3.0"
description = "MiniCPM-o 事件检测"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.0",
    "python-dotenv>=1.2",
    "numpy>=1.26",
