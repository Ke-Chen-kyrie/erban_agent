[project]
name = "event-detection"
version = "0.1.0"
description = "实时异常事件检测 — 养老监护场景（JoyAI-VL-Interaction 编排架构）"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "openai>=1.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "websockets>=12.0",
    "rosbags>=0.11",
    "python-dotenv>=1.0",
    "eclipse-zenoh==1.10.0",
    "pyaudio>=0.2.14",
    "scipy>=1.15.3",
    "langfuse>=4.15.1",
]

[project.scripts]
event-detection = "main:main"
