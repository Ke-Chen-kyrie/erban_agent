<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理 · 迩伴Agent</title><style>
:root{color-scheme:light;--bg:#f4f8fb;--card:#ffffff;--soft:#3a6d92;--line:rgba(0,76,131,.18);--text:#004c83;--muted:#52708a;--mint:#fe6100;--danger:#d93636;--shadow:0 18px 50px rgba(0,76,131,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:22px 0 36px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none}.mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid rgba(0,76,131,.25);border-radius:13px;color:#fff;background:linear-gradient(145deg,#0b64a5,var(--text))}.mark svg{width:22px;fill:none;stroke:currentColor;stroke-width:1.7}.brand strong{display:block;font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em}.nav{display:flex;gap:8px}.nav a,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:#fff;text-decoration:none;cursor:pointer;transition:.18s}.nav a{font-size:13px}.nav a.active,.btn.primary{color:#fff;border-color:var(--mint);background:var(--mint);font-weight:700}.btn:hover:not(:disabled){border-color:rgba(254,97,0,.55);background:rgba(254,97,0,.08)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.danger{color:var(--danger);border-color:rgba(217,54,54,.4);background:rgba(217,54,54,.07)}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px}.search{position:relative;min-width:280px}.search input{width:100%;min-height:44px;padding:0 15px 0 40px;border:1px solid var(--line);border-radius:13px;outline:none;color:var(--text);background:#fff}.search svg{position:absolute;left:14px;top:13px;width:18px;fill:none;stroke:var(--muted);stroke-width:1.7}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:18px;align-items:start}.panel{border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:0 20px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.count{color:var(--muted);font-size:12px}.user-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:610px;padding:16px;overflow:auto}.user-card{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:76px;padding:12px;border:1px solid var(--line);border-radius:15px;color:var(--text);background:#fff;text-align:left;cursor:pointer}.user-card:hover{border-color:rgba(254,97,0,.45);background:rgba(254,97,0,.05)}.user-card.selected{border-color:var(--mint);background:rgba(254,97,0,.09)}.avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;color:#fff;background:linear-gradient(145deg,#0b64a5,var(--text));font-size:17px;font-weight:750}.user-copy{min-width:0}.user-copy b,.user-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-copy b{font-size:14px}.user-copy span{margin-top:4px;color:var(--muted);font-size:11px}.role{padding:4px 8px;border-radius:99px;color:var(--text);background:rgba(0,76,131,.08);font-size:10px}.empty{grid-column:1/-1;padding:70px 20px;color:var(--muted);text-align:center}.detail{padding:20px}.face{display:grid;place-items:center;width:100%;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#0a1622}.face img{width:100%;height:100%;object-fit:cover}.placeholder{color:var(--muted);font-size:12px;text-align:center}.detail-title{margin:18px 0 12px}.detail-title h3{margin:0;font-size:20px}.detail-title span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.detail-line{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12px}.detail-line b{color:var(--muted);font-weight:500}.detail-line span{text-align:right;word-break:break-all}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.status{min-height:22px;margin:14px 4px 0;color:var(--muted);font-size:12px;line-height:1.6}.status.ok{color:var(--mint)}.status.err{color:var(--danger)}@media(max-width:900px){.layout{grid-template-columns:1fr}.user-list{max-height:none}}@media(max-width:650px){.shell{width:calc(100% - 20px)}.brand small{display:none}.nav a{padding:0 10px}.hero{align-items:stretch;flex-direction:column}.toolbar{flex-wrap:wrap}.search{min-width:100%;width:100%}.user-list{grid-template-columns:1fr}.panel{border-radius:18px}}
</style><style>body.embedded .shell{width:100%;padding:0}body.embedded .topbar{display:none}body.embedded .panel{box-shadow:none}body.embedded .hero{margin-bottom:14px}body.embedded .hero>div:first-child{display:none}.refresh-toast{position:fixed;top:22px;right:22px;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid rgba(0,76,131,.2);border-radius:12px;color:var(--text);background:rgba(255,255,255,.97);box-shadow:0 14px 40px rgba(0,76,131,.18);font-size:13px;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .2s ease,transform .2s ease}.refresh-toast.show{opacity:1;pointer-events:auto;transform:translateY(0)}.refresh-toast svg{width:18px;height:18px;flex:none;fill:none;stroke:#149a63;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.refresh-toast button{display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:8px;color:var(--muted);background:transparent;cursor:pointer;font-size:15px;line-height:1}.refresh-toast button:hover{color:var(--text);background:rgba(0,76,131,.08)}</style></head><body><div class="refresh-toast" id="refreshToast" role="status"><svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg><span>刷新完成</span><button type="button" id="refreshToastClose" aria-label="关闭">×</button></div><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="mark"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.3c0 4.6 3 7.7 7.5 9.7 4.5-2 7.5-5.1 7.5-9.7V6L12 3Z"/><path d="M8.5 12h2l1.2-2.6 1.5 5 1.1-2.4h1.5"/></svg></span><span><strong>迩伴Agent</strong><small>CARE IDENTITY</small></span></a><nav class="nav"><a href="/register">用户注册</a><a class="active" href="/users">用户管理</a><a href="/">返回首页</a></nav></header>
<section class="hero"><div><h1>用户管理</h1><p>查找和维护已登记的用户资料</p></div><div class="toolbar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="searchInput" placeholder="搜索姓名、ID、角色或备注"></label><button class="btn" id="refreshBtn">刷新</button></div></section>
<main class="layout"><section class="panel"><div class="panel-head"><h2>全部用户</h2><span class="count" id="userCount">加载中…</span></div><div class="user-list" id="userList"><div class="empty" id="listEmpty">正在加载用户…</div></div></section><aside class="panel"><div class="panel-head"><h2>用户详情</h2><span class="count">IDENTITY</span></div><div class="detail"><div class="face"><div class="placeholder" id="facePlaceholder">从左侧选择一位用户</div><img id="faceImg" style="display:none" alt="用户照片"></div><div class="detail-title"><h3 id="detailName">尚未选择</h3><span id="detailId">选择用户后查看完整资料</span></div><div id="detailBody"></div><div class="actions"><span></span><button class="btn danger" id="deleteBtn" disabled>删除这位用户</button></div></div></aside></main><div class="status" id="status" role="status"></div></div>
<script>
if(typeof location!=="undefined"&&location.search.indexOf("embed=1")!==-1)document.body.classList.add("embedded");
const $=id=>document.getElementById(id);let users=[],selectedId=null;
function setStatus(text,kind){$("status").textContent=text;$("status").className="status"+(kind?" "+kind:"")}
async function fetchJSON(url,options){let r=await fetch(url,options),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.message||d.error||`HTTP ${r.status}`);return d}
function initials(user){return String(user.name||user.user_id||"用").trim().slice(0,1)}
function filteredUsers(){let key=$("searchInput").value.trim().toLowerCase();return users.filter(u=>!key||[u.user_id,u.name,u.role,u.description].join(" ").toLowerCase().includes(key))}
function renderUsers(){let box=$("userList"),rows=filteredUsers();box.replaceChildren();$("userCount").textContent=`共 ${users.length} 位`;if(!rows.length){let e=document.createElement("div");e.className="empty";e.textContent=users.length?"没有找到匹配的用户":"还没有登记用户";box.append(e);return}for(let user of rows){let card=document.createElement("button");card.type="button";card.className="user-card"+(String(user.user_id)===selectedId?" selected":"");let av=document.createElement("span");av.className="avatar";av.textContent=initials(user);let copy=document.createElement("span");copy.className="user-copy";let name=document.createElement("b");name.textContent=user.name||"未命名";let id=document.createElement("span");id.textContent=`ID · ${user.user_id}`;copy.append(name,id);let role=document.createElement("span");role.className="role";role.textContent=user.role||"未设置";card.append(av,copy,role);card.onclick=()=>selectUser(user);box.append(card)}}
async function loadUsers(announce=true){if(announce)setStatus("正在加载用户…");try{let data=await fetchJSON("/api/identity/users");users=Array.isArray(data.users)?data.users:[];if(selectedId&&!users.some(u=>String(u.user_id)===selectedId))resetDetail();renderUsers();if(announce)setStatus(`已加载 ${users.length} 位用户`)}catch(e){setStatus("加载失败："+e.message,"err")}}
function resetDetail(){selectedId=null;$("faceImg").style.display="none";$("facePlaceholder").style.display="block";$("facePlaceholder").textContent="从左侧选择一位用户";$("detailName").textContent="尚未选择";$("detailId").textContent="选择用户后查看完整资料";$("detailBody").replaceChildren();$("deleteBtn").disabled=true;renderUsers()}
async function selectUser(user){let requestedId=String(user.user_id);selectedId=requestedId;renderUsers();$("detailName").textContent=user.name||"未命名";$("detailId").textContent=`用户 ID · ${requestedId}`;$("faceImg").style.display="none";$("facePlaceholder").style.display="block";$("facePlaceholder").textContent="照片加载中…";let body=$("detailBody");body.replaceChildren();for(let [key,value] of [["角色",user.role],["备注",user.description],["登记时间",user.created_at]]){let line=document.createElement("div"),b=document.createElement("b"),span=document.createElement("span");line.className="detail-line";b.textContent=key;span.textContent=value||"—";line.append(b,span);body.append(line)}$("deleteBtn").disabled=false;try{let data=await fetchJSON("/api/identity/users/"+encodeURIComponent(requestedId)+"/face");if(selectedId!==requestedId)return;if(data.face_image){$("faceImg").src=data.face_image;$("faceImg").style.display="block";$("facePlaceholder").style.display="none"}else{$("facePlaceholder").textContent="暂无照片"}}catch(e){if(selectedId===requestedId)$("facePlaceholder").textContent="照片加载失败"}}
async function deleteUser(userId){if(!confirm(`确认删除用户 ${userId}？\n删除后将同时移除对应的人脸和声纹信息。`))return;setStatus("正在删除用户…");try{let result=await fetchJSON("/api/identity/users/"+encodeURIComponent(userId),{method:"DELETE"});if(!result.deleted)throw Error(result.message||"身份数据未能完整删除");resetDetail();await loadUsers(false);setStatus(`已删除用户 ${userId}`,"ok")}catch(e){setStatus("删除失败："+e.message,"err")}}

$("deleteBtn").onclick=()=>selectedId&&deleteUser(selectedId);
async function showRefreshToast(){let t=$("refreshToast");t.classList.add("show");clearTimeout(showRefreshToast._timer);showRefreshToast._timer=setTimeout(()=>t.classList.remove("show"),1000)}
$("refreshToastClose").onclick=()=>$("refreshToast").classList.remove("show");
$("refreshBtn").onclick=async()=>{await loadUsers();showRefreshToast()};$("searchInput").oninput=renderUsers;loadUsers();
</script></body></html>
