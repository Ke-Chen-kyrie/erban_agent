<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>事件图标预览</title>
  <style>
    :root { color-scheme: dark; --bg:#07100f; --panel:#101d1a; --line:rgba(160,208,190,.14); --text:#edf7f3; --muted:#8fa7a0; --mint:#63e6be; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; padding:42px; color:var(--text); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:radial-gradient(circle at 10% 0,rgba(41,178,133,.13),transparent 36%),var(--bg); }
    header { max-width:1180px; margin:0 auto 28px; }
    h1 { margin:0; font-size:24px; font-weight:650; letter-spacing:.04em; }
    header p { margin:9px 0 0; color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; max-width:1180px; margin:auto; }
    .card { display:grid; grid-template-columns:104px minmax(0,1fr); align-items:center; gap:16px; min-height:132px; padding:14px; border:1px solid var(--line); border-radius:16px; background:linear-gradient(125deg,rgba(255,255,255,.045),rgba(255,255,255,.015)); box-shadow:0 14px 38px rgba(0,0,0,.18); }
    .icon { display:grid; place-items:center; width:104px; height:104px; border:1px solid rgba(99,230,190,.16); border-radius:18px; background:radial-gradient(circle,rgba(99,230,190,.1),rgba(99,230,190,.025)); overflow:hidden; }
    .icon img { display:block; width:96px; height:96px; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.28)); }
    strong { display:block; font-size:15px; font-weight:600; }
    code { display:block; margin-top:7px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,monospace; }
    .loading { max-width:1180px; margin:auto; color:var(--muted); }
    @media(max-width:600px){ body{padding:24px 16px}.grid{grid-template-columns:1fr}.card{grid-template-columns:84px minmax(0,1fr);padding:12px;min-height:108px}.icon{width:84px;height:84px;border-radius:14px}.icon img{width:78px;height:78px} }
  </style>
</head>
<body>
  <header><h1>事件图标预览</h1><p>当前检测系统的 15 个事件图标。告诉我事件英文标签和希望调整的方向即可。</p></header>
  <div class="loading" id="loading">正在载入图标…</div>
  <main class="grid" id="grid"></main>
  <script>
    const events = [
      ["wave","挥手"], ["chest_pain","胸部不适"], ["head_pain","头部不适"],
      ["abdomen_pain","腹部不适"], ["rub_shoulder","揉肩"], ["ok","OK 手势"], ["thumbs_up","点赞手势"],
      ["fall","跌倒"], ["bed_fall","坠床"], ["lying_on_ground","躺在地上"],
      ["smoke","烟雾"], ["fire","明火"],
      ["water_stain","地面积水"], ["water_stain_danger","积水滑倒风险"], ["night_leaving","夜间离床"]
    ];

    try {
      const grid = document.getElementById("grid");
      events.forEach(([label,title]) => {
        const card=document.createElement("article"); card.className="card";
        const iconBox=document.createElement("div"); iconBox.className="icon";
        const icon=document.createElement("img"); icon.src=`/event_icons/${label}.png`; icon.alt=`${title}图标`; iconBox.append(icon);
        const text=document.createElement("div"); const strong=document.createElement("strong"); strong.textContent=title;
        const code=document.createElement("code"); code.textContent=label; text.append(strong,code); card.append(iconBox,text); grid.append(card);
      });
      document.getElementById("loading").remove();
    } catch (error) { document.getElementById("loading").textContent=`图标载入失败：${error.message}`; }
  </script>
</body>
</html>
