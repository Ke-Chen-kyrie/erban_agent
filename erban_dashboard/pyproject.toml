[project]
name = "erban-dashboard"
version = "0.1.0"
description = "迩伴实时照护大屏：aiohttp 事件/视频/进程控制仪表盘"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10",
    "python-dotenv>=1.0",
    "rosbags>=0.11",
    "websockets>=12",
]

[project.scripts]
erban-dashboard = "erban_dashboard_app.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["erban_dashboard_app"]

[tool.setuptools.package-data]
erban_dashboard_app = ["static/**/*"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
package = true